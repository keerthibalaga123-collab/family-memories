<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Family Story ❤️</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Loading Screen -->

<div id="loader">

    <div class="heart">❤️</div>

    <h1>Loading Memories...</h1>

</div>

<!-- Intro Screen -->

<section id="intro">

    <div class="stars"></div>

    <div class="content">

        <h3 class="fade">Some memories never fade...</h3>

        <h3 class="fade delay1">Some bonds never break...</h3>

        <h1 class="fade delay2">❤️ Our Family Story ❤️</h1>

        <p class="fade delay3">

            Every smile...

            Every hug...

            Every memory...

            Lives forever.

        </p>

        <button id="beginBtn">

            Begin Our Journey

        </button>

    </div>

</section>

<script src="script.js"></script>

</body>

</html>
