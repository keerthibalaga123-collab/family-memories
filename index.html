<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Family Story ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Loading Screen -->

<div id="loader">

<div class="loader-content">

<h1>❤️</h1>

<h2>Loading Memories...</h2>

</div>

</div>

<!-- Intro -->

<section id="intro">

<div class="overlay"></div>

<div class="intro-content">

<h3>Some memories never fade...</h3>

<h3>Some bonds never break...</h3>

<h1>❤️ Our Family Story ❤️</h1>

<p>
Every smile... Every hug... Every memory...
</p>

<button id="startBtn">

Begin Our Journey

</button>

</div>

</section>

<!-- Gallery -->

<section id="gallery">

<img id="photo" src="images/photo1.jpg">

<div class="quote-box">

<h2 id="quote"></h2>

<p id="counter"></p>

</div>

<div class="buttons">

<button id="prevBtn">⏮ Previous</button>

<button id="nextBtn">Next ⏭</button>

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

</section>

<!-- Ending -->

<section id="ending">

<h1>❤️ Thank You ❤️</h1>

<p>

No matter where life takes us,

our hearts always find their way home.

</p>

<h2>

I Love My Family Forever ❤️

</h2>

<button onclick="location.reload()">

Watch Again ❤️

</button>

</section>

<script src="script.js"></script>

</body>

</html>
