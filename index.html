<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our Family Story ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<!-- Floating Hearts -->
<div id="hearts"></div>

<!-- Floating Particles -->
<div id="particles"></div>

<!-- Loader -->
<div id="loader">

<div class="loader-content">

<div class="loader-heart">❤️</div>

<h2>Loading Beautiful Memories...</h2>

</div>

</div>

<!-- Intro -->
<section id="intro">

<div class="overlay"></div>

<div class="intro-content">

<h3>Every picture tells a story...</h3>

<h1>❤️ Our Family Story ❤️</h1>

<p>

Some memories never fade.

Some bonds never break.

Some people stay in our hearts forever.

</p>

<button id="startBtn">

Begin Our Journey

</button>

</div>

</section>

<!-- Gallery -->
<section id="gallery">

<div class="photo-container">

<img id="photo" src="images/photo1.jpg" alt="Family Photo">

</div>

<div class="caption-box">

<h2 id="quote"></h2>

<p id="counter"></p>

</div>

<div class="controls">

<button id="prevBtn">

<i class="fa-solid fa-backward"></i>

Previous

</button>

<button id="playPause">

<i class="fa-solid fa-pause"></i>

</button>

<button id="nextBtn">

Next

<i class="fa-solid fa-forward"></i>

</button>

</div>

<div class="progress">

<div id="progressBar"></div>

</div>

</section>

<!-- Ending -->
<section id="ending">

<h1>❤️ Thank You ❤️</h1>

<p>

Family is not an important thing...

It is everything.

</p>

<h2>

Forever Together ❤️

</h2>

<button onclick="location.reload()">

Watch Again ❤️

</button>

</section>

<!-- Music -->

<audio id="bgMusic" loop>

<source src="music/family-song.mp3" type="audio/mpeg">

</audio>

<script src="script.js"></script>

</body>

</html>
